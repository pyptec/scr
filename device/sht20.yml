medidores:  
  sht20_sensor:

    enabled: true
    source_type: device

    device_name: "SHT20"
    id_device: 7 #7  #26

    gateway:
      gateway_id: 8
      nombre: "SAMEE100-ALKOSTO"
      tipo: "Gateway energético"
      ubicacion: "Tablero solar"
      cliente: "PANELES"

    device:
      device_id: 7
      nombre: "SHT20"
      tipo: "Sensor temperatura y humedad"
      ubicacion: "Gabinete SAMEE100"
      cliente: "PANELES"
      
    port: "/dev/ttyS0" #"/dev/ttyUSB0"
    debug: False #True #False #
    slave_id: 8
    baudrate: 19200
    bytesize: 8
    parity: N
    stopbits: 1
    timeout: 1
    tipo: "g"
    simular: False

    registers:
      - name: Temperature
        address: 1
        fc: 4
        decimals: 1        # decimals = 0 → deja el valor tal cual (entero), decimals = 1 → divide el valor por 10, decimals = 2 → divide por 100
        readWrite: "R"
        unit: 1
        alias: Temp
      - name: Humidity
        address: 2
        fc: 4
        decimals: 1        # decimals = 0 → deja el valor tal cual (entero), decimals = 1 → divide el valor por 10, decimals = 2 → divide por 100
        readWrite: "R"
        unit: 2
        alias: Humidity