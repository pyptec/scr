medidores:  
  sht20_sensor:
    device_name: "SHT20"
    id_device: 28  #26
    enabled: true
    source_type: device

    gateway:
      gateway_id: 14
      nombre: "SAMEE200-LPS-AOKI"
      tipo: "Gateway energético industrial"
      ubicacion: "Planta LPS"
      cliente: "LPS"
    device:
      device_id: 28
      nombre: "Sensor ambiente SHT20"
      tipo: "Sensor temperatura y humedad"
      ubicacion: "Gabinete SAMEE200"
      
    port: "/dev/ttyS0"
    debug: False #True debuger modbus
    slave_id: 8
    baudrate: 19200
    bytesize: 8
    parity: N
    stopbits: 1
    timeout: 1
    tipo: "g"
    simular: False

    registers:
      - name: Temperature
        address: 1
        fc: 4
        decimals: 1        # decimals = 0 → deja el valor tal cual (entero), decimals = 1 → divide el valor por 10, decimals = 2 → divide por 100
        readWrite: "R"
        unit: 1
        alias: Temp
      - name: Humidity
        address: 2
        fc: 4
        decimals: 1        # decimals = 0 → deja el valor tal cual (entero), decimals = 1 → divide el valor por 10, decimals = 2 → divide por 100
        readWrite: "R"
        unit: 2
        alias: Humidity
