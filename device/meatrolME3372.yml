
medidores:
  meatrolME337_2:
    device_name: "ME337"
    id_device: 25
    port: "/dev/ttyS0"
    debug: False 
    slave_id: 46
    tipo: "g"
    baudrate: 19200
    bytesize: 8
    parity: N
    stopbits: 1
    timeout: 1
      
    
    registers:
#******************************
      #Corrientes: IL1, IL2, IL3
#******************************
      - name: Phase L1 current
        address: 1000
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 10
        alias: AL1
      - name: Phase L2 current
        address: 1002
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 11
        alias: AL2
      - name: Phase L3 current
        address: 1004
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 12
        alias: AL3
      - name: Average value of L1L2L3 three-phase current AvgA1A2A3
        address: 1006
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 54
        alias: AVGcurrent
      - name: Phase N current
        address: 1008
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 55
        alias: Ncurrent
#******************************
      #Voltajes: VL1, VL2, VL3
#******************************
      - name: voltage L1
        address: 1010
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 7
        alias: VL1
      - name: voltage L2
        address: 1012
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 8
        alias: VL2
      - name: voltage L3
        address: 1014
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 9
        alias: VL3
  
      - name: Average value of L1L2L3 three-phase phase voltage
        address: 1016
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 56
        alias: L1L2L3 voltage
#******************************
      #Line voltage: VL1-VL2, VL2-VL3, VL3-VL1
#******************************      

      - name: U1-U2 voltage
        address: 1020
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 29
        alias: U12
      - name: U2-U3 voltage
        address: 1022
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 30
        alias: U12
      - name: U3-U12 voltage
        address: 1024
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 31
        alias: U12
      - name: Average value of three-phase line voltage
        address: 1026
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 57
        alias: AVGU12U23U31
#******************************
      #Potencias activas: P1, P2, P3, PTotal
#******************************   

      - name: Phase L1 Active Power
        address: 1028
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 58
        alias: P1
      - name: Phase L2 Active Power
        address: 1030
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 59
        alias: P2
      - name: Phase L3 Active Power
        address: 1032
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 60
        alias: P3
      - name: Total Active power
        address: 1034
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 61
        alias: PTotal 

#******************************
      #Potencias reactivas: Q1, Q2, Q3, QTotal
#******************************   

      - name: Phase L1 Reactive power
        address: 1036
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 62
        alias: Q1 
      - name: Phase L2 Reactive power
        address: 1038
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 63
        alias: Q2 
      - name: Phase L3 Reactive power
        address: 1040
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 64
        alias: Q3 
      - name: Total Reactive power
        address: 1042
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 65
        alias: QTotal 

#******************************
      #Potencias aparentes: S1, S2, S3, STotal
#******************************  
      - name: Phase L1 Apparent power
        address: 1044
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 66
        alias: S1  
      - name: Phase L2 Apparent power
        address: 1046
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 67
        alias: S2 
      - name: Phase L3 Apparent power
        address: 1048
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 68
        alias: S3 
      - name: Total Apparent power
        address: 1050
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 69
        alias: STotal

#******************************
      #Factor de potencia: PF1, PF2, PF3, PFTotal
#******************************  
      - name: Phase 1 power factor 
        address: 1052
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 70
        alias: PF1
      - name: Phase 2 power factor 
        address: 1054
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 71
        alias: PF2
      - name: Phase 3 power factor 
        address: 1056
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 72
        alias: PF3
      - name: Total power factor 
        address: 1058
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 73
        alias: PFTotal

#******************************
      #Frecuencia
#******************************  
      - name: Phase L1 frequency 
        address: 1068
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 74
        alias: Freq1
      - name: Phase L2 frequency 
        address: 1070
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 75
        alias: Freq2
      - name: Phase L3 frequency 
        address: 1072
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 76
        alias: Freq3
      - name: Frequency of supply voltages
        address: 1074
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 27
        alias: FreqTotal
#******************************
      #CALIDAD DE LA ENERGÍA ELÉCTRICA
#******************************             
      - name: Phase L1 current total harmonic percentage
        address: 4000
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 117
        alias: I1THD
      - name: Phase L2 current total harmonic percentage
        address: 4002
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 118
        alias: I2THD
      - name: Phase L3 current total harmonic percentage
        address: 4004
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 119
        alias: I3THD
      - name: Phase L1 volage total harmonic percentage
        address: 5000
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 120
        alias: U1THD
      - name: Phase L2 volage total harmonic percentage
        address: 5002
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 121
        alias: U2THD
      - name: Phase L3 volage total harmonic percentage
        address: 5004
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 122
        alias: U3THD
      - name: Phase L1 Maximum current
        address: 6000
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 123
        alias: I1Max
      - name: Phase L2 Maximum current
        address: 6002
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 124
        alias: I2Max
      - name: Phase L3 Maximum current
        address: 6004
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 125
        alias: I3Max
      - name: Phase L1 Minimum current
        address: 6010
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 126
        alias: I1Min
      - name: Phase L2 Minimum current
        address: 6012
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 127
        alias: I2Min
      - name: Phase L3 Minimum current
        address: 6014
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 128
        alias: I3Min
      - name: U1-UN Maximum phase voltage
        address: 6020
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 129
        alias: U1Max
      - name: U2-UN Maximum phase voltage
        address: 6022
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 130
        alias: U2Max
      - name: U3-UN Maximum phase voltage
        address: 6024
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 131
        alias: U3Max
      - name: U1-UN Minimum phase voltage
        address: 6030
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 132
        alias: U1Min
      - name: U2-UN Minimum phase voltage
        address: 6032
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 133
        alias: U2Min
      - name: U3-UN Minimum phase voltage
        address: 6034
        fc: 3
        # decimals: 2
        type: float32
        readWrite: "R"
        unit: 134
        alias: U3Min

#******************************
      #ENERGÍA EP1Imp, EP2Imp, EP3Imp, EPTotalImp
#******************************  
      - name: Total Positive active energy
        address: 2606
        fc: 3
        type: uint32
        unit: 100
        alias: kWh_total

      - name: Phase L1 Positive active energy
        address: 2600
        fc: 3
        type: uint32
        unit: 97
        alias: kWh_L1

      - name: Phase L2 Positive active energy
        address: 2602
        fc: 3
        type: uint32
        unit: 98
        alias: kWh_L2

      - name: Phase L3 Positive active energy
        address: 2604
        fc: 3
        type: uint32
        unit: 99
        alias: kWh_L3
#******************************
      #ENERGÍA EXPORTADA SABER CUANTO GENERA EP1Exp, EP2Exp, EP3Exp, EPTotalExp
#****************************** 
      - name: Phase L1 Active Energy Export
        address: 2608
        fc: 3
        type: uint32
        readWrite: "R"
        unit: 101
        alias: kWh_L1Exp

      - name: Phase L2 Active Energy Export
        address: 2610
        fc: 3
        type: uint32
        readWrite: "R"
        unit: 102
        alias: kWh_L2Exp

      - name: Phase L3 Active Energy Export
        address: 2612
        fc: 3
        type: uint32
        readWrite: "R"
        unit: 103
        alias: kWh_L3Exp

      - name: Total Active Energy Export
        address: 2614
        fc: 3
        type: uint32
        readWrite: "R"
        unit: 104
        alias: kWh_totalExp


#******************************
      #ENERGÍA REACTIVA PENALIZACIONES EQImp, EQExp
#****************************** 
      - name: Total Positive reactive energy
        address: 2622
        fc: 3
        type: uint32
        readWrite: "R"
        unit: 108
        alias: kVArh_total

      - name: Total Reverse reactive energy
        address: 2630
        fc: 3
        type: uint32
        readWrite: "R"
        unit: 112
        alias: kVArh_Exp

#******************************
      #ENERGÍA APARENTWE ANALISIS PROFUNDO (ES)
#****************************** 
      - name: Total Apparent Energy
        address: 2638
        fc: 3
        type: uint32
        readWrite: "R"
        unit: 116
        alias: kVAh_total