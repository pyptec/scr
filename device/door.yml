medidores:
  door_sensor:
    i: 10  #8  #10  es el debuger en la plataforma      # identificador lógico del grupo o área (igual que en otros)15 es el de prueba
    gateway:
      gateway_id: 10
      nombre: "SAMEE100-PANELES"
      tipo: "Gateway energético"
      ubicacion: "Tablero solar"
      cliente: "PANELES"

    device:
      device_id: 40
      nombre: "Sensor de puerta"
      tipo: "Entrada digital / Puerta"
      ubicacion: "Gabinete SAMEE100"
    
    name: "door_chamber"
    invert_active_low: true
    debounce_ms: 80
    registers:
      - name: estado_puerta
        alias: door_open
        v: 1                # 1 = abierta
        u: 138
      - name: duracion_abierta
        alias: door_open_duration_s
        v: 0                # segundos que ha estado abierta 
        u: 145