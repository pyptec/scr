<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SAMEE100 Solar</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header class="main-header">
    <div class="header-left">
        <img
            src="{{ url_for('static', filename='img/pyp_logo.jpg') }}"
            alt="Logo PYP"
            class="logo-pyp"
        >

        <span>SAMEE100 Solar - Dashboard Energético</span>
    </div>
</header>

<div class="filtro-tiempo">
    <label for="rangoTiempo">Rango:</label>

    <select id="rangoTiempo" onchange="cambiarRangoTiempo()">
        <option value="hora">Última hora</option>
        <option value="hoy" selected>Hoy</option>
        <option value="semana">Semana</option>
        <option value="mes">Mes</option>
        <option value="anio">Año</option>
        <option value="todo">Todo</option>
    </select>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>Potencia Actual</h3>
            <div class="value">
                <span id="potencia">--</span>
                <span class="unit">kW</span>
            </div>
        </div>

        <div class="card">
            <h3>Generación Periodo</h3>
            <div class="value">
                <span id="generacion">--</span>
                <span class="unit">kWh</span>
            </div>
        </div>

        <div class="card">
            <h3>Consumo Periodo</h3>
            <div class="value">
                <span id="consumo">--</span>
                <span class="unit">kWh</span>
            </div>
        </div>

        <div class="card">
            <h3>Ahorro Estimado</h3>
            <div class="value">
                $<span id="ahorro">--</span>
            </div>
        </div>

        <div class="card">
            <h3>CO₂ Evitado</h3>
            <div class="value">
                <span id="co2">--</span>
                <span class="unit">kg</span>
            </div>

    <div class="variable-selector">
        <label for="selectVariable">Variable personalizada:</label>

        <select id="selectVariable">
            <option value="">Cargando variables...</option>
        </select>

        <button onclick="graficarVariableSeleccionada()">
            Graficar
        </button>

        <button onclick="generarReporteExcelVariable()">
            Reporte Excel variable
        </button>

        <button onclick="generarReporteExcelTodas()">
            Reporte Excel todas
        </button>
    </div>


        </div>

    </div>

    <div class="chart-selector">
    <button onclick="mostrarGrafica('potencia')">Potencia</button>
    <button onclick="mostrarGrafica('energia')">Generación Diaria</button>
    <button onclick="mostrarGrafica('voltajes')">Voltajes L-N</button>
    <button onclick="mostrarGrafica('corrientes')">Corrientes</button>
</div>

<div class="chart-box mt">
    <h3 id="tituloGrafica">Potencia Activa Total</h3>
    <canvas id="chartPrincipal"></canvas>
    
</div>

<div class="tabla-box mt">
    <div class="tabla-header">
        <h3>Últimos valores reportados</h3>

        <input
            type="text"
            id="buscarTabla"
            placeholder="Buscar por variable, unidad o Unit ID..."
            onkeyup="filtrarTablaUltimos()"
        >
    </div>
    <table class="tabla-valores">
        <thead>
            <tr>
                <th>Unit ID</th>
                <th>Variable</th>
                <th>Valor</th>
                <th>Unidad</th>
                <th>Hora Colombia</th>
            </tr>
        </thead>
        <tbody id="tablaUltimos">
            <tr>
                <td colspan="5">Cargando datos...</td>
            </tr>
        </tbody>
    </table>
</div>

</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>
</html>
